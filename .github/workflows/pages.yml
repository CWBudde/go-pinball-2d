name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libgl1-mesa-dev xorg-dev

      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache pinned quality-tool binaries
        id: quality-tools
        uses: actions/cache@v5.0.3
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-quality-tools-treefmt-release-2.5.0-gofumpt-0.11.0-gci-0.14.0-golangci-2.13.1

      - name: Install pinned treefmt release
        if: steps.quality-tools.outputs.cache-hit != 'true'
        run: |
          # The source module contains an emoji filename rejected by Go's module ZIP validation.
          archive="$RUNNER_TEMP/treefmt_2.5.0_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            https://github.com/numtide/treefmt/releases/download/v2.5.0/treefmt_2.5.0_linux_amd64.tar.gz
          echo "95f707bf9666d08b50888b116768fd77f042ad5af92aa3b795f063160e72758f  $archive" | sha256sum --check
          mkdir -p "$(go env GOPATH)/bin"
          tar -xzf "$archive" -C "$(go env GOPATH)/bin" treefmt

      - name: Install pinned Go quality tools with Go 1.27
        if: steps.quality-tools.outputs.cache-hit != 'true'
        run: |
          go install mvdan.cc/gofumpt@v0.11.0
          go install github.com/daixiang0/gci@v0.14.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Run repository quality gate
        run: just check

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
