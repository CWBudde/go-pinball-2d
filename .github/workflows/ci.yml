name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    uses: ./.github/workflows/test-format.yml

  lint:
    name: Lint
    uses: ./.github/workflows/test-lint.yml

  unit:
    name: Unit tests
    uses: ./.github/workflows/test-unit.yml

  assets:
    name: Generated assets
    uses: ./.github/workflows/test-assets.yml

  build:
    name: Native build
    uses: ./.github/workflows/test-build.yml

  web:
    name: Browser build
    uses: ./.github/workflows/test-web.yml
