name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libgl1-mesa-dev xorg-dev

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache pinned quality-tool binaries
        id: quality-tools
        uses: actions/cache@v5.0.3
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-quality-tools-treefmt-2.5.0-gofumpt-0.11.0-gci-0.14.0-golangci-2.13.1

      - name: Install pinned quality tools with Go 1.27
        if: steps.quality-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/numtide/treefmt/v2/cmd/treefmt@v2.5.0
          go install mvdan.cc/gofumpt@v0.11.0
          go install github.com/daixiang0/gci@v0.14.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Run repository quality gate
        run: just check
