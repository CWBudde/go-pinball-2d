name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go from go.mod
        id: go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libgl1-mesa-dev xorg-dev

      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache pinned lint binaries
        id: lint-tools
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/go/bin/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-lint-tools-go-${{ steps.go.outputs.go-version }}-golangci-2.13.1

      - name: Install pinned linter
        if: steps.lint-tools.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Run lint
        run: just lint
