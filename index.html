<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <title>Neon Relay — 2D Pinball</title>
    <link rel="icon" type="image/png" href="./assets/images/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
        background: #050816;
        color: #cffdff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 8%, rgb(32 232 255 / 10%), transparent 34rem),
          radial-gradient(circle at 20% 80%, rgb(255 43 173 / 8%), transparent 28rem), #050816;
      }

      main {
        width: min(100%, 720px);
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      .cabinet {
        position: relative;
        width: min(100%, calc((100vh - 112px) * 2 / 3));
        aspect-ratio: 2 / 3;
        overflow: hidden;
        border: 1px solid rgb(32 232 255 / 42%);
        border-radius: 20px;
        background: #050816;
        box-shadow:
          0 0 0 5px rgb(10 18 43 / 90%),
          0 0 36px rgb(32 232 255 / 17%),
          0 20px 70px rgb(0 0 0 / 55%);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        image-rendering: auto;
      }

      canvas:focus-visible {
        box-shadow: inset 0 0 0 3px #a9ff4f;
      }

      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 28px;
        color: #20e8ff;
        text-align: center;
        line-height: 1.55;
        background: rgb(5 8 22 / 92%);
        transition: opacity 180ms ease;
        pointer-events: none;
      }

      #status[hidden] {
        display: none;
      }

      #status.error {
        color: #ff617c;
        pointer-events: auto;
      }

      #controls {
        margin: 0;
        color: #8fa9c8;
        font-size: clamp(0.68rem, 2vw, 0.82rem);
        line-height: 1.5;
        text-align: center;
      }

      kbd {
        padding: 0.08rem 0.32rem;
        border: 1px solid #355577;
        border-bottom-width: 2px;
        border-radius: 4px;
        color: #cffdff;
        background: #0a122b;
      }

      @media (max-height: 700px) {
        body {
          place-items: start center;
        }

        #controls {
          max-width: 50rem;
        }
      }
    </style>
    <script src="./wasm_exec.js"></script>
  </head>
  <body>
    <main>
      <section class="cabinet" aria-label="Neon Relay pinball cabinet">
        <canvas
          id="gameCanvas"
          width="720"
          height="1080"
          tabindex="0"
          role="img"
          aria-label="Portrait pinball playfield. Use the keyboard controls described below."
          aria-describedby="controls"
        >
          Neon Relay needs a browser with HTML canvas and WebAssembly support.
        </canvas>
        <div id="status" role="status" aria-live="polite">Charging the Neon Relay…</div>
      </section>
      <p id="controls">
        <kbd>A</kbd>/<kbd>←</kbd> left flipper · <kbd>D</kbd>/<kbd>→</kbd> right flipper ·
        hold/release <kbd>Space</kbd>/<kbd>↓</kbd> to launch · <kbd>Enter</kbd> start ·
        <kbd>P</kbd> pause · <kbd>F</kbd> fullscreen
      </p>
    </main>
    <script>
      (() => {
        "use strict";

        const status = document.getElementById("status");
        const canvas = document.getElementById("gameCanvas");

        function fail(error) {
          console.error(error);
          status.hidden = false;
          status.classList.add("error");
          status.textContent =
            "Neon Relay could not start. Reload the page; if this persists, check that WebAssembly is enabled. " +
            String(error);
        }

        async function instantiate(go) {
          const response = await fetch("./main.wasm");
          if (!response.ok) {
            throw new Error(`main.wasm returned HTTP ${response.status}`);
          }

          if (WebAssembly.instantiateStreaming) {
            try {
              return await WebAssembly.instantiateStreaming(response.clone(), go.importObject);
            } catch (streamingError) {
              console.warn("Streaming WebAssembly failed; using ArrayBuffer fallback.", streamingError);
            }
          }

          const bytes = await response.arrayBuffer();
          return WebAssembly.instantiate(bytes, go.importObject);
        }

        async function start() {
          if (typeof WebAssembly !== "object") {
            throw new Error("This browser does not support WebAssembly.");
          }
          if (typeof Go !== "function") {
            throw new Error("wasm_exec.js did not load.");
          }

          const go = new Go();
          status.textContent = "Loading pinball engine…";
          const result = await instantiate(go);
          status.textContent = "Starting Neon Relay…";
          const running = go.run(result.instance);
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              status.hidden = true;
              canvas.focus({ preventScroll: true });
            }),
          );
          await running;
          throw new Error("The game engine stopped unexpectedly.");
        }

        start().catch(fail);
      })();
    </script>
  </body>
</html>
